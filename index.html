<!DOCTYPE html>
<html lang="en">
<head>

<title>BTEUP Result Portal</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#2563eb,#38bdf8);
}

.card{
width:90%;
max-width:380px;
background:#fff;
padding:30px;
border-radius:22px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,.3);
animation:pop .6s ease;
}

@keyframes pop{
from{opacity:0;transform:scale(.9);}
to{opacity:1;transform:scale(1);}
}

.logo{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:#2563eb;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
color:#fff;
margin-bottom:20px;
}

h1{
font-size:26px;
color:#0f172a;
margin-bottom:10px;
}

p{
color:#666;
font-size:15px;
line-height:1.6;
margin-bottom:25px;
}

.btn{
display:block;
width:100%;
padding:16px;
font-size:18px;
font-weight:bold;
text-decoration:none;
text-align:center;
border-radius:12px;
background:#2563eb;
color:#fff;
transition:.3s;
}

.btn:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(37,99,235,.35);
}

.btn:active{
transform:scale(.96);
}

.footer{
margin-top:20px;
font-size:13px;
color:#888;
}
</style>
</head>
