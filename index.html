
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTEUP Result Direct Portal</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#2563eb,#38bdf8);
}

.card{
width:90%;
max-width:380px;
background:white;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.logo{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
font-size:45px;
color:white;
margin-bottom:20px;
}

h1{
font-size:25px;
color:#111827;
margin-bottom:12px;
}

p{
color:#555;
line-height:1.6;
margin-bottom:25px;
}

button{
width:100%;
padding:15px;
border-radius:12px;
border:2px solid #2563eb;
background:#2563eb;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-3px);
box-shadow:0 10px 20px rgba(37,99,235,.4);
}

button:active{
transform:scale(.95);
}

.footer{
margin-top:20px;
font-size:13px;
color:#777;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">🎓</div>

<h1>BTEUP Result Portal</h1>

<p>
Click below to open BTEUP Result page directly.
Keep your details ready to check result.
</p>

<!-- JavaScript हटाकर सीधे आधिकारिक रिजल्ट लिंक जोड़ा गया है -->
<a href="https://bteupexam.co.in" target="_blank" style="text-decoration: none;">
  <button>
  Check BTEUP Result
  </button>
</a>

<div class="footer">
BTEUP Students Result Access
</div>

</div>

</body>
</html>
