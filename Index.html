<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTEUP Result Portal</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#2563eb,#38bdf8);
overflow:hidden;
}

.card{
width:90%;
max-width:380px;
background:#fff;
padding:30px;
border-radius:22px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,.3);
animation:pop .8s ease;
}

@keyframes pop{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}

.logo{
width:90px;
height:90px;
margin:auto;
border-radius:50%;
background:#2563eb;
display:flex;
justify-content:center;
align-items:center;
font-size:42px;
color:white;
margin-bottom:20px;
}

h1{
font-size:26px;
color:#0f172a;
margin-bottom:10px;
}

p{
color:#666;
font-size:15px;
line-height:1.6;
margin-bottom:25px;
}

button{
width:100%;
padding:16px;
font-size:18px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 10px 20px rgba(37,99,235,.35);
}

button:active{
transform:scale(.95);
}

.footer{
margin-top:20px;
font-size:13px;
color:#888;
}
</style>

</head>
<body>

<div class="card">

<div class="logo">🎓</div>

<h1>BTEUP Result Portal</h1>

<p>
Click the button below to open the official BTEUP Result Portal and check your result securely.
</p>

<button onclick="window.location.href='https://www.bteup.ac.in/AUTHUSER/StudentLoginForEvenSemester.aspx'">
Go to Official Result
</button>

<div class="footer">
Official BTEUP Website
</div>

</div>

</body>
</html>
